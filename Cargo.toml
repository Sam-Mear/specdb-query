[package]
name = "specdb-query"
version = "0.1.0"
edition = "2024"

[dependencies]
async-graphql = "7.0.17"
async-graphql-axum = "7.0.17"
axum = { version="0.8.4", features=["macros"] }
axum-extra = { version = "0.10.3", features = ["protobuf"] }
directories = "6.0.0"
prost = "0.13.5"
rapidhash = "4.1.0"
regex = "1.11.3"
serde = { version="1.0.219", features = ["derive"] }
serde_json = "1.0.140"
specdb = {path = "../specdb-rs"}
tokio = { version = "1.46.1", features = ["rt-multi-thread"] }
tower-http = { version = "0.6.6", features = ["trace"] }
tracing = "0.1.41"
tracing-subscriber = "0.3.19"
yaml-rust2 = "0.10.4"
